name: "Stacks: Deploy"

on:
  # Plan on demand, for re-checking a stack after an out-of-band prerequisite
  # changes. Never applies: apply stays bound to pushes on main.
  workflow_dispatch:
  pull_request:
    paths:
      - "stacks/**"
      - ".github/workflows/stacks.yml"
  push:
    branches: [main]
    paths:
      - "stacks/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # Stacks are independent; one failing stack must not cancel the others.
      fail-fast: false
      matrix:
        stack:
          - { name: "10-identity-cloudsso", account_key: "management", iam_account_key: "iam" }
          - { name: "11-log-archive", account_key: "log-archive", iam_account_key: "" }
          - { name: "12-guardrails-preventive", account_key: "devops", iam_account_key: "" }
          - { name: "13-guardrails-detective", account_key: "security", iam_account_key: "" }
          - { name: "20-network-cen", account_key: "network", iam_account_key: "" }
          - { name: "21-network-dmz", account_key: "network", iam_account_key: "" }
          - { name: "30-security-kms", account_key: "security", iam_account_key: "" }
          - { name: "30-security-firewall", account_key: "network", iam_account_key: "" }
          - { name: "30-security-waf", account_key: "shared", iam_account_key: "" }
    defaults:
      run:
        working-directory: stacks/${{ matrix.stack.name }}
    env:
      ACCOUNT_ID: ${{ fromJSON(vars.SPOKE_ACCOUNT_IDS_JSON)[matrix.stack.account_key] }}
      IAM_ACCOUNT_ID: ${{ matrix.stack.iam_account_key != '' && fromJSON(vars.SPOKE_ACCOUNT_IDS_JSON)[matrix.stack.iam_account_key] || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Alibaba Cloud credentials (OIDC)
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.GHA_PLAN_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          TFSTATE_REGION: ${{ vars.TFSTATE_REGION }}
          TFSTATE_TABLESTORE_ENDPOINT: ${{ vars.TFSTATE_TABLESTORE_ENDPOINT }}
          TFSTATE_TABLESTORE_TABLE: ${{ vars.TFSTATE_TABLESTORE_TABLE }}
          BACKEND_PREFIX: stacks/${{ matrix.stack.name }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$TFSTATE_REGION" \
            -backend-config="tablestore_endpoint=$TFSTATE_TABLESTORE_ENDPOINT" \
            -backend-config="tablestore_table=$TFSTATE_TABLESTORE_TABLE" \
            -backend-config="prefix=$BACKEND_PREFIX"

      - name: Terraform Plan
        env:
          TF_VAR_spoke_role_arn: "acs:ram::${{ env.ACCOUNT_ID }}:role/SpokeDeployRole"
          TF_VAR_iam_role_arn: ${{ env.IAM_ACCOUNT_ID != '' && format('acs:ram::{0}:role/SpokeDeployRole', env.IAM_ACCOUNT_ID) || '' }}
        run: |
          if [ -f prod.tfvars ]; then
            terraform plan -input=false -no-color -out=tfplan -var-file=prod.tfvars
          else
            terraform plan -input=false -no-color -out=tfplan
          fi
          terraform show -no-color tfplan > plan.txt

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.stack.name }}
          path: stacks/${{ matrix.stack.name }}/plan.txt

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        stack:
          - { name: "10-identity-cloudsso", account_key: "management", iam_account_key: "iam" }
          - { name: "11-log-archive", account_key: "log-archive", iam_account_key: "" }
          - { name: "12-guardrails-preventive", account_key: "devops", iam_account_key: "" }
          - { name: "13-guardrails-detective", account_key: "security", iam_account_key: "" }
          - { name: "20-network-cen", account_key: "network", iam_account_key: "" }
          - { name: "21-network-dmz", account_key: "network", iam_account_key: "" }
          - { name: "30-security-kms", account_key: "security", iam_account_key: "" }
          - { name: "30-security-firewall", account_key: "network", iam_account_key: "" }
          - { name: "30-security-waf", account_key: "shared", iam_account_key: "" }
    defaults:
      run:
        working-directory: stacks/${{ matrix.stack.name }}
    env:
      ACCOUNT_ID: ${{ fromJSON(vars.SPOKE_ACCOUNT_IDS_JSON)[matrix.stack.account_key] }}
      IAM_ACCOUNT_ID: ${{ matrix.stack.iam_account_key != '' && fromJSON(vars.SPOKE_ACCOUNT_IDS_JSON)[matrix.stack.iam_account_key] || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Alibaba Cloud credentials (OIDC)
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.GHA_APPLY_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.OIDC_PROVIDER_ARN }}
          audience: sts.aliyuncs.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          TFSTATE_REGION: ${{ vars.TFSTATE_REGION }}
          TFSTATE_TABLESTORE_ENDPOINT: ${{ vars.TFSTATE_TABLESTORE_ENDPOINT }}
          TFSTATE_TABLESTORE_TABLE: ${{ vars.TFSTATE_TABLESTORE_TABLE }}
          BACKEND_PREFIX: stacks/${{ matrix.stack.name }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$TFSTATE_REGION" \
            -backend-config="tablestore_endpoint=$TFSTATE_TABLESTORE_ENDPOINT" \
            -backend-config="tablestore_table=$TFSTATE_TABLESTORE_TABLE" \
            -backend-config="prefix=$BACKEND_PREFIX"

      - name: Terraform Apply
        env:
          TF_VAR_spoke_role_arn: "acs:ram::${{ env.ACCOUNT_ID }}:role/SpokeDeployRole"
          TF_VAR_iam_role_arn: ${{ env.IAM_ACCOUNT_ID != '' && format('acs:ram::{0}:role/SpokeDeployRole', env.IAM_ACCOUNT_ID) || '' }}
        run: |
          if [ -f prod.tfvars ]; then
            terraform apply -input=false -auto-approve -var-file=prod.tfvars
          else
            terraform apply -input=false -auto-approve
          fi
